name: ci

# ADAPT of PaperTrail's ci.yml: no eval gate (the benchmark is bench.yml), no OpenAPI check, no Cloud Run;
# + the scoring package and the Playbook contract (part of test:int). CI never sees a provider key.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Types, Tests & Builds
    runs-on: ubuntu-latest
    # The API's env module validates these at import. Placeholders: no step connects to them; the
    # integration tests start their own Postgres 17 and Redis with Testcontainers.
    env:
      PORT: "5000"
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      JWT_SECRET: ci-jwt-secret-not-used-0123456789-abcdefgh
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-not-used-0123456789
      GOOGLE_CLIENT_ID: ci
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build shared packages
        run: pnpm --filter @repo/types build && pnpm --filter @repo/scoring build

      - name: README results block matches its committed snapshot
        run: pnpm --filter api readme:check

      - name: Scoring tests (table + property, 100 % branch coverage)
        run: pnpm --filter @repo/scoring exec vitest run --coverage

      - name: API unit tests
        run: pnpm --filter api test

      - name: Integration tests (Testcontainers; includes the Playbook contract)
        run: pnpm --filter api test:int

      - name: Build Web Application (with the API unreachable, as on Vercel)
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci

  e2e:
    name: Playwright E2E Tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @repo/types build && pnpm --filter @repo/scoring build

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      # Only the infrastructure runs in containers; Playwright's webServer config starts the NIM stub, the
      # API (own database promptlab_e2e) and the web app itself. Specs that need the Playbook repo skip.
      - name: Start infrastructure (Postgres, Redis x2)
        run: docker compose up -d --wait postgres redis redis-cache

      - name: Run Playwright E2E Tests
        run: pnpm --filter web e2e
        env:
          CI: "true"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  image:
    name: Build & Push Container Image
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API & Worker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Optional secrets: GitHub refuses `secrets.*` inside `if:`, so each is mapped to env first.
      - name: Trigger API Deploy (Render; migrations run before the API starts)
        if: env.RENDER_API_DEPLOY_HOOK != ''
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: curl -fsS -X POST "${RENDER_API_DEPLOY_HOOK}"

      - name: Trigger Worker Deploy (Render)
        if: env.RENDER_WORKER_DEPLOY_HOOK != ''
        env:
          RENDER_WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "${RENDER_WORKER_DEPLOY_HOOK}"

      - name: Health Check Smoke Test
        if: env.API_HEALTH_URL != ''
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          echo "Polling health endpoint: $API_HEALTH_URL"
          for i in $(seq 1 30); do
            if curl -fsS "$API_HEALTH_URL"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check timed out"
          exit 1
